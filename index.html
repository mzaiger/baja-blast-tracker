<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Baja Blast Promotion: Regular Season</title>
    <style>
        * { box-sizing: border-box; }

        body {
            background-color: #111827;
            color: #ffffff;
            padding: 2rem;
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        .container {
            max-width: 64rem;
            margin: 0 auto;
        }

        header {
            margin-bottom: 2rem;
            text-align: center;
        }

        h1 {
            font-size: 2.25rem;
            font-weight: 700;
            color: #22d3ee;
            margin: 0 0 0.25rem 0;
        }

        .subtitle {
            color: #9ca3af;
            margin: 0;
        }

        .col-headers {
            display: none;
            grid-template-columns: 1fr auto auto auto;
            gap: 1rem;
            padding: 0 1rem;
            margin-bottom: 0.5rem;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #6b7280;
            font-weight: 600;
        }

        .col-headers span.stat-col {
            text-align: center;
            width: 6rem;
        }

        #hr-list {
            display: grid;
            gap: 0.75rem;
        }

        .loading, .empty {
            text-align: center;
            font-style: italic;
            color: #6b7280;
        }

        .empty { font-style: normal; }

        .hr-card {
            background-color: #1f2937;
            border-radius: 0.5rem;
            border-left: 4px solid #22d3ee;
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.3), 0 4px 6px -4px rgba(0,0,0,0.3);
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 0 1rem;
            align-items: center;
            padding: 0.75rem 1rem;
        }

        .player-name {
            font-size: 1.125rem;
            font-weight: 700;
            line-height: 1.2;
        }

        .matchup {
            font-size: 0.75rem;
            color: #9ca3af;
            margin-top: 0.125rem;
        }

        .stat-block {
            display: none;
            flex-direction: column;
            align-items: center;
            width: 6rem;
        }

        .stat-block .value {
            font-size: 1.125rem;
            font-weight: 600;
        }

        .stat-block .value.velo { color: #facc15; }
        .stat-block .value.angle { color: #60a5fa; }

        .stat-block .label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .distance-block {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 6rem;
        }

        .distance-block .value {
            font-size: 1.5rem;
            font-weight: 900;
            color: #22d3ee;
        }

        .distance-block .value .unit {
            font-size: 1rem;
            font-weight: 400;
        }

        .distance-block .label {
            font-size: 0.75rem;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: 0.03em;
        }

        .mobile-stats {
            grid-column: span 2;
            display: flex;
            gap: 1.5rem;
            margin-top: 0.5rem;
            padding-top: 0.5rem;
            border-top: 1px solid #374151;
        }

        .mobile-stats .velo { color: #facc15; font-weight: 600; }
        .mobile-stats .angle { color: #60a5fa; font-weight: 600; }
        .mobile-stats .stat-label {
            margin-left: 0.25rem;
            font-size: 0.75rem;
            color: #6b7280;
        }

        .unit-label, .muted {
            font-size: 0.75rem;
            color: #6b7280;
        }

        .dash { color: #4b5563; }

        .pagination {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
        }

        .pagination button {
            background-color: #1f2937;
            color: #e5e7eb;
            border: 1px solid #374151;
            border-radius: 0.375rem;
            padding: 0.4rem 0.75rem;
            font-size: 0.875rem;
            cursor: pointer;
            font-family: inherit;
        }

        .pagination button:hover:not(:disabled) {
            background-color: #374151;
        }

        .pagination button:disabled {
            opacity: 0.4;
            cursor: default;
        }

        .pagination button.active {
            background-color: #22d3ee;
            color: #111827;
            border-color: #22d3ee;
            font-weight: 700;
        }

        .pagination .page-info {
            color: #9ca3af;
            font-size: 0.8rem;
            width: 100%;
            text-align: center;
            margin-top: 0.25rem;
            order: 10;
        }

        @media (min-width: 768px) {
            .col-headers { display: grid; }

            .hr-card {
                grid-template-columns: 1fr auto auto auto;
            }

            .stat-block { display: flex; }

            .mobile-stats { display: none; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔥 Baja Blast Promotion</h1>
            <p class="subtitle">MLB Home Runs ≥ 420ft — <span id="year-sub"></span> Regular Season</p>
        </header>

        <!-- Column headers -->
        <div class="col-headers">
            <span>Player / Matchup</span>
            <span class="stat-col">Exit Velo</span>
            <span class="stat-col">Launch Angle</span>
            <span class="stat-col">Distance</span>
        </div>

        <div id="hr-list">
            <p class="loading">Loading the bombs...</p>
        </div>

        <div id="pagination" class="pagination"></div>
    </div>

    <script>
        // Set current year in subtitle and browser tab
        const currentYear = new Date().getFullYear();
        document.getElementById('year-sub').textContent = currentYear;
        document.title = `Baja Blast Promotion: ${currentYear} Regular Season`;

        const PAGE_SIZE = 100;
        let allData = [];
        let currentPage = 1;

        async function loadHRs() {
            const response = await fetch(`./data.json?v=${Date.now()}`);
            let data = await response.json();

            // Sort most recent first — prefer exact timestamp, fall back to game/inning
            data.sort((a, b) => {
                if (a.time_utc && b.time_utc) return b.time_utc.localeCompare(a.time_utc);
                if (a.date !== b.date) return b.date.localeCompare(a.date);
                if (a.game_pk !== b.game_pk) return (b.game_pk || 0) - (a.game_pk || 0);
                return (b.inning || 0) - (a.inning || 0);
            });

            allData = data;
            currentPage = 1;
            renderPage();
        }

        function renderPage() {
            const container = document.getElementById('hr-list');
            const paginationEl = document.getElementById('pagination');
            container.innerHTML = '';
            paginationEl.innerHTML = '';

            if (allData.length === 0) {
                container.innerHTML = '<p class="empty">No 420ft+ homers yet this season. Pitchers are winning.</p>';
                return;
            }

            const totalPages = Math.max(1, Math.ceil(allData.length / PAGE_SIZE));
            currentPage = Math.min(Math.max(1, currentPage), totalPages);

            const start = (currentPage - 1) * PAGE_SIZE;
            const pageItems = allData.slice(start, start + PAGE_SIZE);

            pageItems.forEach(hr => {
                const velo  = hr.exit_velo    ? `${parseFloat(hr.exit_velo).toFixed(1)} <span class="unit-label">mph</span>`  : '<span class="dash">—</span>';
                const angle = hr.launch_angle ? `${parseFloat(hr.launch_angle).toFixed(1)}<span class="unit-label">°</span>`   : '<span class="dash">—</span>';

                const card = `
                    <div class="hr-card">
                        <div>
                            <div class="player-name">${hr.player}</div>
                            <div class="matchup">${hr.team} vs ${hr.opponent} &bull; ${hr.date}</div>
                        </div>
                        <div class="stat-block">
                            <div class="value velo">${velo}</div>
                            <div class="label">Exit Velo</div>
                        </div>
                        <div class="stat-block">
                            <div class="value angle">${angle}</div>
                            <div class="label">Launch Angle</div>
                        </div>
                        <div class="distance-block">
                            <div class="value">${hr.distance}<span class="unit">'</span></div>
                            <div class="label">Distance</div>
                        </div>
                        <div class="mobile-stats">
                            <div>
                                <span class="velo">${velo}</span>
                                <span class="stat-label">exit velo</span>
                            </div>
                            <div>
                                <span class="angle">${angle}</span>
                                <span class="stat-label">launch angle</span>
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += card;
            });

            renderPagination(totalPages);
        }

        function renderPagination(totalPages) {
            const paginationEl = document.getElementById('pagination');
            if (totalPages <= 1) return;

            function makeBtn(label, page, opts = {}) {
                const btn = document.createElement('button');
                btn.textContent = label;
                if (opts.active) btn.classList.add('active');
                if (opts.disabled) btn.disabled = true;
                btn.addEventListener('click', () => {
                    currentPage = page;
                    renderPage();
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                });
                return btn;
            }

            // Top / Prev
            paginationEl.appendChild(makeBtn('« Top 100', 1, { disabled: currentPage === 1 }));
            paginationEl.appendChild(makeBtn('‹ Prev', currentPage - 1, { disabled: currentPage === 1 }));

            // Windowed page numbers around current page
            const windowSize = 2;
            let pages = new Set([1, totalPages]);
            for (let p = currentPage - windowSize; p <= currentPage + windowSize; p++) {
                if (p >= 1 && p <= totalPages) pages.add(p);
            }
            const sortedPages = Array.from(pages).sort((a, b) => a - b);

            let prevPage = null;
            sortedPages.forEach(p => {
                if (prevPage !== null && p - prevPage > 1) {
                    const ellipsis = document.createElement('span');
                    ellipsis.textContent = '…';
                    ellipsis.className = 'muted';
                    paginationEl.appendChild(ellipsis);
                }
                paginationEl.appendChild(makeBtn(String(p), p, { active: p === currentPage }));
                prevPage = p;
            });

            // Next / Last
            paginationEl.appendChild(makeBtn('Next ›', currentPage + 1, { disabled: currentPage === totalPages }));
            paginationEl.appendChild(makeBtn(`Last 100 »`, totalPages, { disabled: currentPage === totalPages }));

            const info = document.createElement('div');
            info.className = 'page-info';
            const start = (currentPage - 1) * PAGE_SIZE + 1;
            const end = Math.min(currentPage * PAGE_SIZE, allData.length);
            info.textContent = `Showing ${start}–${end} of ${allData.length}`;
            paginationEl.appendChild(info);
        }

        loadHRs();
    </script>
</body>
</html>
